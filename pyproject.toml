[project]
name = "minime-cnmf"
version = "0.0.2"
description = "Factor-first CNMF pipeline for one-photon miniscope data"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Marcel Brosch" }]
keywords = ["calcium imaging", "miniscope", "CNMF", "one-photon", "neuroscience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "numba>=0.60", "opencv-python-headless>=4.9",
  "pandas>=2.2", "typer>=0.12",
  "fastapi>=0.115", "uvicorn>=0.30",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "scikit-learn>=1.4"]  # sklearn: reference fits in tests
tune = ["matplotlib>=3.8"]
[project.scripts]
minime = "minime.cli:app"
[project.urls]
Repository = "https://github.com/MarcelMB/MiniMe"
Issues = "https://github.com/MarcelMB/MiniMe/issues"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/minime"]
artifacts = ["src/minime/serve/static/**"]
[tool.hatch.build.targets.sdist]
artifacts = ["src/minime/serve/static/**"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.pytest.ini_options]
testpaths = ["tests"]
