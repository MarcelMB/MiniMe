[project]
name = "caanfast"
version = "0.0.1"
description = "Factor-first CNMF pipeline for one-photon miniscope data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "numba>=0.60", "opencv-python-headless>=4.9",
  "scikit-learn>=1.4", "pandas>=2.2", "typer>=0.12",
  "fastapi>=0.115", "uvicorn>=0.30",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
bench = ["matplotlib>=3.8"]
[project.scripts]
caanfast = "caanfast.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/caanfast"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.pytest.ini_options]
testpaths = ["tests"]
