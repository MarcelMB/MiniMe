[package]
name = "gpu-spike"
version = "0.0.1"
edition = "2021"
publish = false
description = "Throwaway: wgpu (WebGPU backend) in wasm next to MiniMe's CPU preprocessing"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
gpu = ["dep:wgpu", "dep:futures-channel"]

[dependencies]
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
matrixmultiply = "0.3"
serde_json = "1"
futures-channel = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wgpu = { version = "30", optional = true, default-features = false, features = ["wgsl", "webgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = ["wgsl", "metal"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]

[[example]]
name = "native"
required-features = ["gpu"]

[[example]]
name = "p2_native"
required-features = ["gpu"]
