name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # the oldest supported Python (3.11, see README Install) and the newest on every OS,
    # plus the oldest Ubuntu runner and an Intel Mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - os: ubuntu-22.04
            python: "3.11"
          - os: macos-15-intel
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv --clear && uv pip install -e ".[dev,tune]"
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/minime-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/minime-core
      - run: cargo fmt --check
      # clippy is left out until `cargo clippy --all-targets -- -D warnings` is clean
      # tests/real_frames.rs needs local AVIs ($MINIME_RAW) and skips without them
      - run: cargo test --release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # the wasm core (web/src/stream/pkg) is not in git; typecheck, tests and build import it
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/minime-core
      - run: cargo install wasm-pack --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the browser tests read a tiny Python run and main's answers on it (web/e2e/.data, not in git)
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv venv --clear && uv pip install -e ".[dev,tune]"
        working-directory: .
      - run: npm ci
      - run: npm run wasm
      - run: npm run fixtures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
