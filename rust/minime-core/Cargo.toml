[package]
name = "minime-core"
version = "0.0.1"
edition = "2021"
description = "Bounded-memory streaming MiniMe core (native check harness + wasm for the browser)"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "minime-core"
path = "src/bin/minime-core.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6.4"
realfft = "3.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
