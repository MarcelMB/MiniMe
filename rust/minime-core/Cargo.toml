[package]
name = "minime-core"
version = "0.0.1"
edition = "2021"
description = "Bounded-memory streaming MiniMe core (native check harness + wasm for the browser)"
license = "GPL-3.0-or-later"
publish = false

[features]
# wasm-only micro-benchmark entry point (`bench_wasm.rs`), built by tools/wasm-bench/run.sh
bench = []
# rustfft's wasm simd128 butterflies (browser build only; changes the FFT's rounding, so off by default)
fft-simd = ["rustfft/wasm_simd"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "minime-core"
path = "src/bin/minime-core.rs"

[features]
# step timings (`prof`) and the pre-GEMM-work pass 2 (`compress_ref`) for A/B benches
profile = []
reference = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6.4"
realfft = "3.5"
matrixmultiply = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
